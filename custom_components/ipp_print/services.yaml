print:
  name: Dokument drucken
  description: >-
    Druckt ein PDF, JPG oder PNG über IPP. Entweder eine Datei aus dem
    Home-Assistant-Konfigurationsordner (file_path) oder eine URL angeben.
  fields:
    url:
      name: URL
      description: Adresse des Dokuments (http/https).
      example: "https://example.org/rechnung.pdf"
      selector:
        text:
          type: url
    file_path:
      name: Dateipfad
      description: Pfad relativ zum Home-Assistant-Konfigurationsordner.
      example: "www/rechnung.pdf"
      selector:
        text:
    media:
      name: Papier
      description: PWG-Papierschlüssel, z. B. iso_a4_210x297mm.
      default: iso_a4_210x297mm
      selector:
        text:
    landscape:
      name: Querformat
      default: false
      selector:
        boolean:
    mode:
      name: Anpassen
      description: fit = ganzes Dokument sichtbar, fill = Seite ausfüllen und beschneiden.
      default: fit
      selector:
        select:
          options:
            - fit
            - fill
    color:
      name: Farbe
      default: true
      selector:
        boolean:
    pages:
      name: Seiten
      description: >-
        Seitenauswahl wie "1,3", "1-3", "1-2, 4-5", "gerade" oder "ungerade".
        Leer = alle Seiten. Für beidseitig: erst "ungerade", dann "gerade" mit reverse.
      default: ""
      selector:
        text:
    reverse:
      name: Umgekehrte Reihenfolge
      description: Druckt die Auswahl von hinten nach vorn (für Rückseiten beim beidseitigen Druck).
      default: false
      selector:
        boolean:
